<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Polymarket Smart Money</title>
<style>
  /* minimal reset (the hosted-artifact version gets this from its host) */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  /* ---------- tokens: dark is the base, light is opt-in ----------
     Dark is what this thing is, so it renders dark for everyone regardless of
     the OS setting. Light is a deliberate, fully specified palette rather than
     a washed-out inversion, reached through the toggle in the sidebar and
     remembered per browser. */
  :root {
    --ground: #080B0A;
    --surface: #101614;
    --surface-2: #171F1C;
    --surface-3: #1E2825;
    --line: #232E2A;
    --line-strong: #33413C;
    --ink: #E6EDEA;
    --ink-2: #9EAFA8;
    --ink-3: #6B7C76;
    --accent: #10D296;
    --accent-2: #0B9E71;
    --accent-soft: #0D2C24;
    --on-accent: #04120D;
    --pos: #10D296;
    --neg: #F0705F;
    --warn: #E0A94E;
    --pos-soft: #0D2C24;
    --neg-soft: #2E1815;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px -14px rgba(0, 0, 0, .7);
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="light"] {
    --ground: #F7F8F7;
    --surface: #FFFFFF;
    --surface-2: #F0F3F1;
    --surface-3: #E7ECE9;
    --line: #DCE3DF;
    --line-strong: #C2CDC7;
    --ink: #12201C;
    --ink-2: #4A5C55;
    --ink-3: #7A8A83;
    --accent: #0E7C66;
    --accent-2: #0A6151;
    --accent-soft: #E2F0EB;
    --on-accent: #FBFEFD;
    --pos: #1A7F4B;
    --neg: #B4453A;
    --warn: #B0761E;
    --pos-soft: #E4F1E8;
    --neg-soft: #F8E7E4;
    --shadow: 0 1px 2px rgba(18, 32, 28, .06), 0 8px 24px -12px rgba(18, 32, 28, .12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- shell ---------- */
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

  .rail {
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 18px 14px 28px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 {
    margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em;
  }
  .brand span {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .09em;
  }

  .label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }

  .listset { display: flex; flex-direction: column; gap: 3px; }

  .list-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 9px; border-radius: 4px; border: 1px solid transparent;
    background: none; color: var(--ink-2); font: inherit; font-size: 13px;
    text-align: left; cursor: pointer;
  }
  .list-item:hover { background: var(--surface-2); color: var(--ink); }
  .list-item[aria-current="true"] {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--ink); font-weight: 550;
  }
  .list-item .n {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  }

  /* ---------- controls ---------- */
  button, select, input {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent); border-color: var(--accent);
    color: var(--on-accent); font-weight: 550;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-sm { padding: 3px 7px; font-size: 12px; }
  .btn-ghost { background: none; border-color: var(--line); color: var(--ink-2); }

  :is(button, select, input, a):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--surface);
  }

  .tabs { display: flex; gap: 2px; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 6px 11px; color: var(--ink-3); font-size: 13px; font-weight: 500;
  }
  .tab:hover { color: var(--ink); border-color: var(--line-strong); }
  .tab[aria-selected="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }

  .spacer { margin-left: auto; }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  .content { padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  .toolrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px;
    padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;
  }
  .stat dt {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--ink-3); margin: 0;
  }
  .stat dd {
    margin: 0; font-family: var(--mono); font-size: 19px; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .stat .sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); font-weight: 400; }

  /* ---------- panel + table ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden;
  }
  .panel-head {
    padding: 12px 15px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .panel-head h2 { margin: 0; font-size: 13.5px; font-weight: 620; }
  .panel-head p { margin: 0; font-size: 12px; color: var(--ink-3); }

  .scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; background: var(--surface-2); z-index: 1;
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--ink-3);
    text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--ink); }
  thead th .arrow { color: var(--accent); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  .num {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    text-align: right; white-space: nowrap;
  }
  th.num { text-align: right; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .dim { color: var(--ink-3); }

  .mkt { min-width: 260px; max-width: 420px; }
  .mkt a { color: var(--ink); text-decoration: none; font-weight: 500; }
  .mkt a:hover { color: var(--accent); text-decoration: underline; }
  .mkt .sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }

  .who { display: flex; flex-direction: column; gap: 1px; min-width: 150px; }
  .who .nm { font-weight: 500; }
  .who .ad { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }

  /* outcome + state pills */
  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 3px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: .03em; white-space: nowrap;
  }
  .pill-yes { background: var(--pos-soft); color: var(--pos); }
  .pill-no { background: var(--neg-soft); color: var(--neg); }
  .pill-other { background: var(--surface-2); color: var(--ink-2); }
  .pill-warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .pill-accent { background: var(--accent-soft); color: var(--accent); }

  /* share meter — encodes weight as form, not just number */
  .meter { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
  .meter .bar {
    width: 46px; height: 5px; border-radius: 2px; background: var(--surface-2);
    overflow: hidden; flex: none;
  }
  .meter .bar i { display: block; height: 100%; background: var(--accent); }
  .meter .v { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

  /* consensus dots */
  .dots { display: inline-flex; gap: 2px; align-items: center; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: block; }
  .dots .more { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: 2px; }

  /* ---------- misc states ---------- */
  .empty {
    padding: 44px 22px; text-align: center; color: var(--ink-3);
    display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .empty strong { color: var(--ink); font-size: 14px; }
  .empty p { margin: 0; max-width: 46ch; font-size: 13px; }

  .note {
    background: var(--surface-2); border: 1px solid var(--line); border-left: 2px solid var(--warn);
    border-radius: 4px; padding: 10px 13px; font-size: 12.5px; color: var(--ink-2);
  }
  .note b { color: var(--ink); }

  .bar-progress { height: 2px; background: var(--accent); transition: width .2s; }

  .row-actions { display: flex; gap: 5px; justify-content: flex-end; }

  /* ---------- trader identity ---------- */
  /* Most wallets have no profile image, so the initials chip is the common
     case, not the fallback — it gets the same care as the photo. */
  .trader { display: flex; align-items: center; gap: 9px; min-width: 190px; }
  .av {
    position: relative; width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: var(--surface-3); border: 1px solid var(--line);
    display: grid; place-items: center; overflow: hidden;
    font-family: var(--mono); font-size: 9.5px; font-weight: 600;
    color: var(--ink-3); text-transform: uppercase; letter-spacing: .02em;
  }
  /* The photo covers the initials when it loads and removes itself when it
     doesn't, so a broken avatar URL degrades to initials rather than a hole. */
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .av-lg { width: 32px; height: 32px; font-size: 11px; }

  /* ---------- clickable rows ---------- */
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--surface-2); }
  tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chev { color: var(--ink-3); font-family: var(--mono); }
  tr.clickable:hover .chev { color: var(--accent); }

  /* ---------- search + filter controls ---------- */
  .search { min-width: 190px; font-size: 12.5px; }
  .search::placeholder { color: var(--ink-3); }

  /* ---------- detail sheet ---------- */
  .sheet-back {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .58);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 40px 18px; overflow-y: auto; z-index: 50;
  }
  .sheet {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); width: min(720px, 100%); overflow: hidden;
  }
  .sheet-head { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .sheet-head h2 {
    margin: 0; font-size: 16px; font-weight: 620; line-height: 1.35; letter-spacing: -.01em;
  }
  .sheet-close {
    margin-left: auto; background: none; border: none; color: var(--ink-3);
    font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px;
  }
  .sheet-close:hover { color: var(--ink); background: var(--surface-2); }
  .sheet-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 9px; }
  .tile {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .tile .k {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--ink-3);
  }
  .tile .v {
    font-family: var(--mono); font-size: 20px; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }

  .sheet-link {
    display: block; text-align: center; padding: 11px; border-radius: 7px;
    border: 1px solid var(--line-strong); background: var(--surface-2);
    color: var(--ink-2); text-decoration: none;
    font-family: var(--mono); font-size: 12.5px;
  }
  .sheet-link:hover { color: var(--accent); border-color: var(--accent); }

  .sheet-sec { display: flex; flex-direction: column; gap: 2px; }
  .sheet-sec > h3 {
    margin: 0 0 8px; font-size: 13px; font-weight: 620;
    display: flex; align-items: baseline; gap: 8px;
  }
  .sheet-sec > h3 .c { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; }

  .hold-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-bottom: 1px solid var(--line);
  }
  .hold-row:last-child { border-bottom: none; }
  .hold-row .id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .hold-row .id .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hold-row .id .pl { font-family: var(--mono); font-size: 10.5px; }
  .hold-row .nums {
    margin-left: auto; display: flex; align-items: center; gap: 14px;
    font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--ink-2); white-space: nowrap;
  }
  .hold-row .nums b { color: var(--ink); font-weight: 600; }
  .copy {
    background: none; border: none; color: var(--ink-3); padding: 3px 5px;
    border-radius: 4px; font-size: 12px;
  }
  .copy:hover { color: var(--accent); background: var(--surface-2); }

  .trade-row {
    display: flex; align-items: baseline; gap: 10px; padding: 7px 4px;
    border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  .trade-row:last-child { border-bottom: none; }
  .trade-row .nm { min-width: 120px; color: var(--ink-2); }
  .trade-row .when { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .trade-row .amt { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .skel { color: var(--ink-3); font-size: 12.5px; padding: 10px 4px; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .rail {
      border-right: none; border-bottom: 1px solid var(--line);
      padding: 14px; gap: 14px;
    }
    /* the rail's push-to-bottom footer makes no sense once it's a top strip */
    .rail .rail-foot { margin-top: 0 !important; }
    .content { padding: 16px 14px; gap: 14px; }
    .topbar { padding: 11px 14px; gap: 10px; }
    .tabs { overflow-x: auto; }
    .sheet-back { padding: 0; align-items: stretch; }
    .sheet { border-radius: 0; border: none; min-height: 100%; }
  }
</style>
<script>
  /* Applied before first paint: a reader who chose light shouldn't get a
     dark flash on every load. */
  try {
    var t = localStorage.getItem("pmw.theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode — fall back to the media query */ }
</script>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>Smart Money</h1>
      <span>Polymarket tracker</span>
    </div>

    <div>
      <div class="label" style="margin-bottom:8px">
        <span>Follow lists</span>
        <button class="btn-sm btn-ghost" id="newList" title="Create a new list">+ New</button>
      </div>
      <div class="listset" id="listset"></div>
    </div>

    <div>
      <div class="label" style="margin-bottom:8px"><span>Add wallet</span></div>
      <form id="addForm" style="display:flex;flex-direction:column;gap:6px">
        <input id="addAddr" placeholder="0x wallet address" spellcheck="false"
               style="font-family:var(--mono);font-size:11.5px" />
        <button class="btn-primary btn-sm" type="submit">Add to list</button>
      </form>
    </div>

    <div class="rail-foot" style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <a href="report.html" class="meta"
         style="color:var(--accent);text-decoration:none;font-weight:600">
        Today's report &rarr;
      </a>
      <button class="btn-sm btn-ghost" id="themeBtn" style="align-self:flex-start">Light mode</button>
      <span class="meta">
        Data: Polymarket public API.<br />Lists saved in this browser.
      </span>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-view="discover" aria-selected="true">Discover</button>
        <button class="tab" role="tab" data-view="holdings" aria-selected="false">Holdings</button>
        <button class="tab" role="tab" data-view="flow" aria-selected="false">Flow</button>
        <button class="tab" role="tab" data-view="signals" aria-selected="false">Signals</button>
        <button class="tab" role="tab" data-view="members" aria-selected="false">Members</button>
      </div>
      <div class="spacer"></div>
      <span class="meta" id="status">Ready</span>
      <button class="btn-sm" id="refresh">Refresh</button>
    </div>
    <div class="bar-progress" id="prog" style="width:0"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   Polymarket public endpoints (all CORS-open, no key needed)
   ============================================================ */
const LB   = "https://lb-api.polymarket.com";      // /profit, /volume ?window=1d|7d|30d|all
const DATA = "https://data-api.polymarket.com";    // /positions, /activity

const fmtUsd = (n, d = 0) => {
  if (n == null || !isFinite(n)) return "—";
  const a = Math.abs(n);
  const s = n < 0 ? "-" : "";
  if (a >= 1e9) return s + "$" + (a / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return s + "$" + (a / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return s + "$" + (a / 1e3).toFixed(1) + "k";
  return s + "$" + a.toFixed(d);
};
const fmtPct = (n, d = 1) => (n == null || !isFinite(n)) ? "—" : (n * 100).toFixed(d) + "%";
const fmtCents = n => (n == null || !isFinite(n)) ? "—" : (n * 100).toFixed(1) + "¢";
const short = a => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtNum = n => (n == null || !isFinite(n)) ? "—" : Math.round(n).toLocaleString();

/* A wallet's display name is often just its own address + timestamp — useless. */
function cleanName(name, addr) {
  if (!name) return short(addr);
  if (/^0x[0-9a-fA-F]{40}(-\d+)?$/.test(name)) return short(addr);
  return name.length > 26 ? name.slice(0, 25) + "…" : name;
}

/* ---------- storage ---------- */
const KEY = "pmw.lists.v2";
let store = load();

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw && raw.lists && Object.keys(raw.lists).length) return raw;
  } catch (e) { /* fall through to a fresh store */ }
  const id = "l" + Date.now();
  return { lists: { [id]: { id, name: "My picks", wallets: [] } }, activeId: id };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch (e) { setStatus("Could not save — browser storage is full or blocked"); }
}
const activeList = () => store.lists[store.activeId] || Object.values(store.lists)[0];

/* ---------- theme ---------- */
const THEME_KEY = "pmw.theme";
const currentTheme = () => document.documentElement.dataset.theme || "dark";
function wireTheme() {
  const btn = document.getElementById("themeBtn");
  const paint = () => { btn.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode"; };
  btn.onclick = () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* not worth a warning */ }
    paint();
  };
  paint();
}

/* ---------- ui state ---------- */
let view = "discover";
const ui = {
  weight: "capital",          // capital | equal
  flowHours: 24,
  minConsensus: 2,
  lbSearch: "",               // Discover: name/address filter
  lbMinVol: 0,                // Discover: minimum 30d volume
  sort: {}                    // per-view {key, dir}
};

/* ---------- fetch helpers ---------- */
const cache = new Map();
async function getJSON(url, { ttl = 60000 } = {}) {
  const hit = cache.get(url);
  const now = Date.now();
  if (hit && now - hit.t < ttl) return hit.v;
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const v = await r.json();
  cache.set(url, { t: now, v });
  return v;
}

/* Bounded concurrency — be a polite client, and keep progress visible. */
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0, done = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (true) {
      const idx = i++;
      if (idx >= items.length) return;
      try { out[idx] = await fn(items[idx], idx); }
      catch (e) { out[idx] = { __error: e.message }; }
      done++;
      setProgress(done / items.length);
    }
  });
  await Promise.all(workers);
  return out;
}

const $status = document.getElementById("status");
const $prog = document.getElementById("prog");
const setStatus = s => { $status.textContent = s; };
function setProgress(f) {
  $prog.style.width = (f > 0 && f < 1) ? (f * 100).toFixed(0) + "%" : "0";
}

/* ============================================================
   data loaders
   ============================================================ */
/* The leaderboard is capped at 50 rows per board, server-side: `limit` above 50
   is ignored and there is no offset/page/skip. One board therefore can never
   show more than 50 traders.

   What it will do is answer eight different questions — profit and volume, over
   four windows — and the answers overlap only partly. Merging all eight gives a
   few hundred distinct wallets and, more usefully, puts every window on one row,
   so a trader can be judged across timeframes instead of one board at a time.

   The cost is honest gaps: a wallet in the 1d top 50 but not the 30d top 50 has
   no 30d figure, and there is no endpoint to fill it in. Those stay null and are
   rendered as "—" — never as zero, which would read as "made nothing". */
const LB_WINDOWS = ["1d", "7d", "30d", "all"];
const LB_SUFFIX = { "1d": "1d", "7d": "7d", "30d": "30d", "all": "All" };
const LB_COLS = [
  { key: "p1d", label: "P/L 1d" }, { key: "p7d", label: "P/L 7d" },
  { key: "p30d", label: "P/L 30d" }, { key: "pAll", label: "P/L all" },
  { key: "v30d", label: "Vol 30d" }, { key: "vAll", label: "Vol all" }
];

async function loadLeaderboardUniverse() {
  const jobs = [];
  for (const metric of ["profit", "volume"])
    for (const w of LB_WINDOWS)
      jobs.push({ prefix: metric === "profit" ? "p" : "v", w,
                  url: `${LB}/${metric}?window=${w}&limit=50` });

  const results = await mapLimit(jobs, 4, j => getJSON(j.url, { ttl: 120000 }));

  const by = new Map();
  let failed = 0;
  results.forEach((rows, i) => {
    if (!Array.isArray(rows)) { failed++; return; }
    const j = jobs[i];
    const col = j.prefix + LB_SUFFIX[j.w];
    rows.forEach((r, idx) => {
      const address = (r.proxyWallet || "").toLowerCase();
      if (!/^0x[0-9a-f]{40}$/.test(address)) return;
      let e = by.get(address);
      if (!e) {
        e = {
          address, name: cleanName(r.name || r.pseudonym, r.proxyWallet),
          avatar: "", best: Infinity,
          p1d: null, p7d: null, p30d: null, pAll: null,
          v1d: null, v7d: null, v30d: null, vAll: null
        };
        by.set(address, e);
      }
      if (!e.avatar) e.avatar = r.profileImageOptimized || r.profileImage || "";
      e[col] = Number(r.amount) || 0;
      e.best = Math.min(e.best, idx + 1);   // best placing on any board
    });
  });

  // Every board failing is a real failure; a few failing is a thinner list.
  if (!by.size) throw new Error("No leaderboard data came back");

  const rows = [...by.values()].map(e => ({
    ...e,
    ret30: (e.p30d != null && e.v30d > 0) ? e.p30d / e.v30d : null,
    retAll: (e.pAll != null && e.vAll > 0) ? e.pAll / e.vAll : null
  }));
  return { rows, failed, boards: jobs.length };
}

/* Positions for every wallet in a list, plus each wallet's own total. */
async function loadListPositions(wallets) {
  const res = await mapLimit(wallets, 5, async w => {
    // redeemable=false filters settled markets out server-side. That matters for
    // more than tidiness: heavy traders can have hundreds of unredeemed settled
    // bets, and without this they eat the 500-row cap and hide the live positions.
    const rows = await getJSON(
      `${DATA}/positions?user=${w.address}&limit=500&sizeThreshold=1` +
      `&redeemable=false&sortBy=CURRENT&sortDirection=DESC`,
      { ttl: 90000 });
    return { wallet: w, positions: Array.isArray(rows) ? rows : [] };
  });
  return res.map((r, i) => r && !r.__error ? r
    : { wallet: wallets[i], positions: [], error: r && r.__error });
}

async function loadListActivity(wallets, hours) {
  const start = Math.floor(Date.now() / 1000) - hours * 3600;
  const res = await mapLimit(wallets, 5, async w => {
    const rows = await getJSON(
      `${DATA}/activity?user=${w.address}&limit=500&type=TRADE&start=${start}&sortDirection=DESC`,
      { ttl: 60000 });
    return { wallet: w, trades: Array.isArray(rows) ? rows : [] };
  });
  return res.map((r, i) => r && !r.__error ? r
    : { wallet: wallets[i], trades: [], error: r && r.__error });
}

/* ============================================================
   aggregation

   Key insight: aggregate per OUTCOME TOKEN (`asset`), not per market —
   two followed wallets can sit on opposite sides of the same market, and
   collapsing those would invent a consensus that isn't there.
   ============================================================ */
/* Deciding what still counts as a live bet.

   `/positions` keeps finished markets in the list until the trader redeems them,
   and the `redeemable` flag alone is not enough: plenty of positions sit at 0¢,
   fully lost, without ever being flagged. One wallet in testing showed a $3.2k
   book carrying $661k of "unrealised" loss — 292 dead bets it had never cashed
   out. Summed naively, that single graveyard set the headline number for the
   whole group.

   So liveness is about whether the market is still genuinely undecided. Anything
   pinned to the extremes is over in practice — no edge left to copy, and its
   long-settled loss has no business in a P&L for open bets. */
const DECIDED_LOW = 0.01, DECIDED_HIGH = 0.99;
const COLLAPSED = 0.15;
function isLive(p) {
  if (p.redeemable === true) return false;
  if ((Number(p.currentValue) || 0) <= 0) return false;
  const price = Number(p.curPrice) || 0;
  if (price < DECIDED_LOW || price > DECIDED_HIGH) return false;
  // Also over in practice: a bet that has lost nearly all its value while its
  // market stays technically open. Judged against ENTRY rather than an absolute
  // floor, so a longshot bought at 3¢ and still at 3¢ survives while 2¢ bought
  // at 40¢ does not. Across the top 40 wallets these came to 1.4% of the book
  // but 60% of the unrealised loss.
  const avg = Number(p.avgPrice) || 0;
  if (avg > 0 && price / avg < COLLAPSED) return false;
  return true;
}

function aggregateHoldings(perWallet, weightMode) {
  let settledCount = 0, settledValue = 0;
  for (const { positions } of perWallet) {
    for (const p of positions) {
      if (!isLive(p)) { settledCount++; settledValue += Number(p.currentValue) || 0; }
    }
  }

  const walletTotal = new Map();
  for (const { wallet, positions } of perWallet) {
    walletTotal.set(wallet.address,
      positions.filter(isLive).reduce((s, p) => s + (Number(p.currentValue) || 0), 0));
  }
  const grandTotal = [...walletTotal.values()].reduce((a, b) => a + b, 0);
  const active = perWallet.filter(w => (walletTotal.get(w.wallet.address) || 0) > 0);

  const byAsset = new Map();
  for (const { wallet, positions } of perWallet) {
    const wTot = walletTotal.get(wallet.address) || 0;
    for (const p of positions) {
      if (!isLive(p)) continue;
      const value = Number(p.currentValue) || 0;
      const k = p.asset;
      let e = byAsset.get(k);
      if (!e) {
        e = {
          asset: k, conditionId: p.conditionId, title: p.title, slug: p.slug,
          eventSlug: p.eventSlug, outcome: p.outcome, endDate: p.endDate,
          curPrice: Number(p.curPrice) || 0,
          value: 0, size: 0, entryNotional: 0, pnl: 0,
          shareSum: 0, holders: []
        };
        byAsset.set(k, e);
      }
      const size = Number(p.size) || 0;
      e.value += value;
      e.size += size;
      e.entryNotional += size * (Number(p.avgPrice) || 0);
      e.pnl += Number(p.cashPnl) || 0;
      e.curPrice = Number(p.curPrice) || e.curPrice;
      // each holder's conviction = how much of THEIR book sits here
      const personalShare = wTot > 0 ? value / wTot : 0;
      e.shareSum += personalShare;
      e.holders.push({
        address: wallet.address, name: wallet.label || wallet.name,
        value, personalShare, size, avgPrice: Number(p.avgPrice) || 0,
        pnl: Number(p.cashPnl) || 0
      });
    }
  }

  const rows = [...byAsset.values()].map(e => {
    const avgEntry = e.size > 0 ? e.entryNotional / e.size : 0;
    return {
      ...e,
      avgEntry,
      consensus: e.holders.length,
      consensusPct: active.length ? e.holders.length / active.length : 0,
      // capital-weighted: share of the group's total book
      // equal-weighted: average personal allocation, so whales can't dominate
      share: weightMode === "equal"
        ? (active.length ? e.shareSum / active.length : 0)
        : (grandTotal > 0 ? e.value / grandTotal : 0),
      drift: e.curPrice - avgEntry,          // >0 = price ran up since they bought
      pnlPct: e.entryNotional > 0 ? e.pnl / e.entryNotional : 0
    };
  });
  return { rows, grandTotal, walletTotal, activeCount: active.length,
           settledCount, settledValue };
}

function aggregateFlow(perWallet) {
  const byAsset = new Map();
  let trades = 0;
  for (const { wallet, trades: list } of perWallet) {
    for (const t of list) {
      trades++;
      const k = t.asset;
      let e = byAsset.get(k);
      if (!e) {
        e = {
          asset: k, conditionId: t.conditionId, title: t.title, slug: t.slug,
          eventSlug: t.eventSlug, outcome: t.outcome,
          buy: 0, sell: 0, notional: 0, priceNotional: 0,
          last: 0, buyers: new Set(), sellers: new Set()
        };
        byAsset.set(k, e);
      }
      const usd = Number(t.usdcSize) || 0;
      const price = Number(t.price) || 0;
      if (t.side === "SELL") { e.sell += usd; e.sellers.add(wallet.address); }
      else { e.buy += usd; e.buyers.add(wallet.address); }
      e.notional += usd;
      e.priceNotional += usd * price;
      e.last = Math.max(e.last, Number(t.timestamp) || 0);
    }
  }
  const rows = [...byAsset.values()].map(e => ({
    ...e,
    net: e.buy - e.sell,
    vwap: e.notional > 0 ? e.priceNotional / e.notional : 0,
    traders: new Set([...e.buyers, ...e.sellers]).size
  }));
  return { rows, trades };
}

/* Signals: transparent, not a black box.

   The tempting mistake here is to treat "price is now below what they paid" as a
   discount and rank by it. That inverts the list: it floats the group's WORST
   positions to the top, because a price falling away from smart money usually
   means the market learned something they hadn't. A bet down 60% is a warning,
   not a bargain.

   So conviction leads — how many independent wallets hold it, and how much of the
   group's money is behind it. Entry quality is then about being CLOSE to their
   price in either direction: too far above and the move already happened, too far
   below and you're catching a falling knife. */
function buildSignals(hold) {
  return hold.rows
    .filter(r => r.consensus >= ui.minConsensus
              && r.curPrice > 0.02 && r.curPrice < 0.98
              && r.value >= 500)   // ignore dust; a rounding error isn't conviction
    .map(r => {
      const entryRoom = r.avgEntry > 0 ? (r.avgEntry - r.curPrice) / r.avgEntry : 0;
      const conviction = Math.log2(1 + r.consensus) * 2
                       + Math.min(1.5, r.share * 20);
      const proximity = 1 - Math.min(1, Math.abs(entryRoom) / 0.25);
      return { ...r, entryRoom, conviction, score: conviction + proximity * 0.8 };
    })
    .sort((a, b) => b.score - a.score);
}

/* ============================================================
   sorting
   ============================================================ */
/* Missing is not zero. A wallet outside a board's top 50 has no figure for that
   column, and sorting it as 0 would rank it above every trader who actually lost
   money — and, ascending, put the unknowns first. So blanks sink to the bottom
   whichever way the column is sorted, and the reversal happens inside the
   comparator rather than by reversing the finished array. */
function sortRows(rows, key, dir, fallback) {
  const k = key || fallback;
  const asc = dir === "asc";
  const gone = v => v == null || v === "" || (typeof v === "number" && !isFinite(v));
  return [...rows].sort((a, b) => {
    const x = a[k], y = b[k];
    if (gone(x) && gone(y)) return 0;
    if (gone(x)) return 1;
    if (gone(y)) return -1;
    const c = (typeof x === "string" || typeof y === "string")
      ? String(x).localeCompare(String(y))
      : (Number(y) || 0) - (Number(x) || 0);
    return asc ? -c : c;
  });
}
function th(label, key, cur, cls = "num") {
  const on = cur.key === key;
  const arrow = on ? `<span class="arrow">${cur.dir === "asc" ? "↑" : "↓"}</span>` : "";
  return `<th class="${cls} sortable" data-sort="${key}">${esc(label)} ${arrow}</th>`;
}
function curSort(v, fallback) {
  if (!ui.sort[v]) ui.sort[v] = { key: fallback, dir: "desc" };
  return ui.sort[v];
}

/* Avatar: initials underneath, photo on top when there is one. An avatar URL
   that 404s removes itself and leaves the initials showing. */
function avatar(r, big) {
  const src = r.avatar || (universe && universe.get(r.address) || {}).avatar || "";
  const base = String(r.name || "").replace(/^0x/i, "");
  const ini = (/^[a-z0-9]/i.test(base) ? base : r.address.slice(2)).slice(0, 2);
  return `<span class="av${big ? " av-lg" : ""}">${esc(ini)}${
    src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
}

/* market link + outcome pill */
function marketCell(r) {
  const href = r.eventSlug ? `https://polymarket.com/event/${encodeURIComponent(r.eventSlug)}`
                           : "https://polymarket.com";
  return `<td class="mkt">
    <a href="${href}" target="_blank" rel="noopener noreferrer">${esc(r.title || "Untitled market")}</a>
    <div class="sub">${r.endDate ? "ends " + esc(String(r.endDate).slice(0, 10)) : ""}</div>
  </td>`;
}
function outcomeCell(o) { return `<td>${pill(o)}</td>`; }
function meter(share) {
  const w = Math.max(2, Math.min(100, share * 100));
  return `<td class="num"><span class="meter">
    <span class="bar"><i style="width:${w.toFixed(0)}%"></i></span>
    <span class="v">${fmtPct(share)}</span></span></td>`;
}
function dots(n, total) {
  const show = Math.min(n, 6);
  return `<td class="num"><span class="dots">
    ${"<i></i>".repeat(show)}${n > 6 ? `<span class="more">+${n - 6}</span>` : ""}
    <span class="more">${n}/${total}</span></span></td>`;
}

/* ============================================================
   views
   ============================================================ */
const $content = document.getElementById("content");

function renderRail() {
  const set = document.getElementById("listset");
  set.innerHTML = Object.values(store.lists).map(l => `
    <button class="list-item" data-list="${esc(l.id)}"
            aria-current="${l.id === store.activeId}">
      <span>${esc(l.name)}</span><span class="n">${l.wallets.length}</span>
    </button>`).join("");
}

/* Renders are async, so a slow one can finish AFTER the user has already clicked
   somewhere else and paint the wrong screen over their choice. Every render takes
   a ticket; a render whose ticket is no longer the current one throws its work
   away instead of painting. */
let renderSeq = 0;
const stale = seq => seq !== renderSeq;

async function render() {
  const seq = ++renderSeq;
  renderRail();
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.view === view)));
  try {
    if (view === "discover") await renderDiscover(seq);
    else if (view === "members") renderMembers();
    else await renderListView(seq);
  } catch (e) {
    if (stale(seq)) return;
    $content.innerHTML = `<div class="panel"><div class="empty">
      <strong>Couldn't load data</strong>
      <p>${esc(e.message)}. Polymarket's API may be rate-limiting or temporarily down —
      press Refresh to try again.</p></div></div>`;
    setStatus("Error");
  } finally { setProgress(0); }
}

/* ---------- Discover ---------- */
let universe = null;         // shared with the drill-down, for each holder's all-time P&L
let keepSearchFocus = false; // survives the re-render the search box triggers

async function renderDiscover(seq) {
  setStatus("Loading eight leaderboards…");
  const uni = await loadLeaderboardUniverse();
  if (stale(seq)) return;
  universe = new Map(uni.rows.map(r => [r.address, r]));

  const cur = curSort("discover", "p30d");
  const q = ui.lbSearch.trim().toLowerCase();
  const filtered = uni.rows.filter(r =>
    (!q || r.name.toLowerCase().includes(q) || r.address.includes(q)) &&
    (!ui.lbMinVol || (r.v30d != null && r.v30d >= ui.lbMinVol)));
  const sorted = sortRows(filtered, cur.key, cur.dir, "p30d");
  const lists = Object.values(store.lists);
  const sortLabel = (LB_COLS.find(c => c.key === cur.key) || {}).label || "Return";

  $content.innerHTML = `
    <div class="toolrow">
      <span class="label">Sort by</span>
      <select id="lbSort">
        ${LB_COLS.map(c => `<option value="${c.key}" ${c.key === cur.key ? "selected" : ""}>${esc(c.label)}</option>`).join("")}
        <option value="ret30" ${cur.key === "ret30" ? "selected" : ""}>Return 30d</option>
      </select>
      <input class="search" id="lbSearch" placeholder="Search name or 0x…"
             spellcheck="false" value="${esc(ui.lbSearch)}" />
      <span class="label">Min 30d volume</span>
      <select id="lbMinVol">${[0, 10000, 100000, 1000000].map(n =>
        `<option value="${n}" ${n === ui.lbMinVol ? "selected" : ""}>${n ? fmtUsd(n) : "Any"}</option>`).join("")}</select>
      <div class="spacer"></div>
      <span class="label">Add top</span>
      <select id="bulkN">${[10, 20, 50].map(n => `<option value="${n}">${n}</option>`).join("")}</select>
      <span class="label">to</span>
      <select id="bulkList">${lists.map(l =>
        `<option value="${esc(l.id)}" ${l.id === store.activeId ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select>
      <button class="btn-primary btn-sm" id="bulkAdd">Add</button>
    </div>

    <dl class="stats">
      ${stat("Traders found", String(uni.rows.length), `across ${uni.boards - uni.failed} of ${uni.boards} boards`)}
      ${stat("Showing", String(sorted.length), q || ui.lbMinVol ? "after filters" : "no filters applied")}
      ${stat("Sorted by", sortLabel, cur.dir === "desc" ? "highest first" : "lowest first")}
      ${stat("In your lists", String(new Set(Object.values(store.lists).flatMap(l => l.wallets.map(w => w.address))).size), "unique wallets followed")}
    </dl>

    ${uni.failed ? `<div class="note">${uni.failed} of ${uni.boards} leaderboards failed to
      load, so some columns are thinner than usual. Press Refresh to retry.</div>` : ""}

    <div class="note">
      <b>Read this ranking carefully.</b> It sorts by raw dollars, which tracks bankroll size
      as much as skill — a whale who risks millions outranks a sharper trader with a smaller
      book. <b>Return</b> (profit ÷ volume) is the closer thing to an edge measure. Neither
      separates skill from luck over a short window. A <b>dash means unknown</b>, not zero:
      Polymarket only publishes the top 50 per board, so a trader outside that cut for a
      given window has no figure there.
    </div>

    ${!sorted.length ? `<div class="panel"><div class="empty">
        <strong>No trader matches those filters</strong>
        <p>Clear the search box or lower the minimum volume.</p>
      </div></div>` : `
    <div class="panel">
      <div class="panel-head">
        <h2>Top traders</h2>
        <p>${sorted.length} of ${uni.rows.length} wallets · every window on one row</p>
      </div>
      <div class="scroll">
        <table>
          <thead><tr>
            <th class="num">#</th>
            <th>Trader</th>
            ${LB_COLS.map(c => th(c.label, c.key, cur)).join("")}
            ${th("Return 30d", "ret30", cur)}
            <th class="num">Add to list</th>
          </tr></thead>
          <tbody>${sorted.map((r, i) => `
            <tr>
              <td class="num dim">${i + 1}</td>
              <td><div class="trader">
                ${avatar(r)}
                <span class="who">
                  <span class="nm">${esc(r.name)}</span>
                  <span class="ad">${esc(short(r.address))}</span>
                </span>
              </div></td>
              ${LB_COLS.map(c => money(r[c.key], c.key[0] === "v")).join("")}
              <td class="num ${r.ret30 == null ? "dim" : r.ret30 >= 0 ? "pos" : "neg"}">${
                r.ret30 == null ? "—" : fmtPct(r.ret30, 1)}</td>
              <td class="num"><div class="row-actions">
                <button class="btn-sm" data-add="${esc(r.address)}"
                        data-name="${esc(r.name)}">+ ${esc(activeList().name)}</button>
              </div></td>
            </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`}`;

  document.getElementById("lbSort").onchange = e => {
    ui.sort.discover = { key: e.target.value, dir: "desc" }; render();
  };
  document.getElementById("lbMinVol").onchange = e => {
    ui.lbMinVol = +e.target.value; render();
  };
  const $search = document.getElementById("lbSearch");
  $search.oninput = debounce(e => {
    ui.lbSearch = e.target.value; keepSearchFocus = true; render();
  }, 250);
  // The re-render replaces the input the user is typing into, so put the caret back.
  if (keepSearchFocus) {
    keepSearchFocus = false;
    $search.focus();
    $search.setSelectionRange($search.value.length, $search.value.length);
  }
  document.getElementById("bulkAdd").onclick = () => {
    const n = +document.getElementById("bulkN").value;
    const listId = document.getElementById("bulkList").value;
    let added = 0;
    for (const r of sorted.slice(0, n)) if (addWallet(listId, r.address, r.name)) added++;
    save(); renderRail();
    setStatus(`Added ${added} wallet${added === 1 ? "" : "s"} to ${store.lists[listId].name}`);
  };
  wireSort("discover");
  setStatus(`${uni.rows.length} traders`);
}

/* A dash for a missing figure, never a zero. */
function money(v, dimmed) {
  if (v == null) return `<td class="num dim">—</td>`;
  const cls = dimmed ? "dim" : (v >= 0 ? "pos" : "neg");
  return `<td class="num ${cls}">${fmtUsd(v)}</td>`;
}

/* Re-rendering on every keystroke refetches nothing (the cache holds) but does
   rebuild a 300-row table, which stutters while typing. */
function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/* ---------- Members ---------- */
function renderMembers() {
  const l = activeList();
  $content.innerHTML = `
    <div class="toolrow">

      <div class="scroll"><table>

          </tr>`).join("")}</tbody>

function readPill(r) {
  if (r.entryRoom > 0.25)
    return `<span class="pill pill-warn">down hard since they bought</span>`;
  if (r.entryRoom > 0.05)
    return `<span class="pill pill-accent">below their entry</span>`;
  if (r.entryRoom > -0.05)
    return `<span class="pill pill-yes">near their entry</span>`;
  if (r.entryRoom > -0.25)
    return `<span class="pill pill-other">moved up</span>`;
  return `<span class="pill pill-warn">move already happened</span>`;
}

/* ============================================================
   position drill-down

   The aggregate row says five wallets agree. That is the least interesting part
   of the fact: which five, how much each committed, what each paid, and whether
   they bought together or drifted in over a month are what make it worth acting
   on — or not.
   ============================================================ */
let lastPositions = new Map();        // asset -> aggregated row, for the sheet
const tradeCache = new Map();         // asset -> trades, so reopening is instant
const DETAIL_DAYS = 30;

async function ensureUniverse() {
  if (universe) return universe;
  try {
    const uni = await loadLeaderboardUniverse();
    universe = new Map(uni.rows.map(r => [r.address, r]));
  } catch (e) { universe = new Map(); }   // P&L column simply stays blank
  return universe;
}

function openDetail(asset) {
  const r = lastPositions.get(asset);
  if (!r) return;

  const holders = [...r.holders].sort((a, b) => b.value - a.value);
  const href = r.eventSlug ? `https://polymarket.com/event/${encodeURIComponent(r.eventSlug)}`
                           : "https://polymarket.com";
  const days = r.endDate
    ? Math.ceil((new Date(r.endDate).getTime() - Date.now()) / 86400000) : null;

  const back = document.createElement("div");
  back.className = "sheet-back";
  back.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.title || "Position")}">
      <div class="sheet-head">
        <div class="top">
          ${pill(r.outcome)}
          <span class="pill pill-other">${r.holders.length} wallet${r.holders.length === 1 ? "" : "s"}</span>
          <button class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
        </div>
        <h2>${esc(r.title || "Untitled market")}</h2>
      </div>
      <div class="sheet-body">
        <div class="tiles">
          ${tile("Total value", fmtUsd(r.value))}
          ${tile("Price", fmtCents(r.curPrice))}
          ${tile("Avg entry", fmtCents(r.avgEntry))}
          ${tile("Days left", days == null ? "—" : days < 0 ? "ended" : String(days))}
        </div>
        <a class="sheet-link" href="${href}" target="_blank" rel="noopener noreferrer">
          View on Polymarket &rarr;</a>

        <div class="sheet-sec">
          <h3>Wallet breakdown <span class="c">who holds it, and what they paid</span></h3>
          ${holders.map(h => {
            const u = universe && universe.get(h.address);
            const all = u && u.pAll != null ? u.pAll : null;
            return `<div class="hold-row">
              ${avatar({ name: h.name, address: h.address, avatar: u && u.avatar }, true)}
              <span class="id">
                <span class="nm">${esc(h.name || short(h.address))}</span>
                <span class="pl ${all == null ? "dim" : all >= 0 ? "pos" : "neg"}"
                      data-pl="${esc(h.address)}">${
                  all == null ? esc(short(h.address))
                              : (all >= 0 ? "+" : "") + fmtUsd(all) + " all-time"}</span>
              </span>
              <span class="nums">
                <span>${fmtNum(h.size)} shares</span>
                <span>avg ${fmtCents(h.avgPrice)}</span>
                <b>${fmtUsd(h.value)}</b>
                <button class="copy" data-copy="${esc(h.address)}" title="Copy address">⧉</button>
              </span>
            </div>`;
          }).join("")}
        </div>

        <div class="sheet-sec" id="tradeSec">
          <h3>When they traded it <span class="c">last ${DETAIL_DAYS} days</span></h3>
          <div class="skel">Loading trades…</div>
        </div>
      </div>
    </div>`;

  document.body.appendChild(back);
  document.body.style.overflow = "hidden";

  const close = () => {
    back.remove();
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
  };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  back.onclick = e => { if (e.target === back) close(); };
  back.querySelector("#sheetClose").onclick = close;
  back.querySelector("#sheetClose").focus();

  loadTrades(r, holders).then(trades => {
    const sec = back.querySelector("#tradeSec");
    if (!sec) return;                       // sheet closed while fetching
    sec.innerHTML = renderTrades(r, holders, trades);
  });

  // Reached Signals without passing through Discover: paint now, fill each
  // holder's all-time P&L in when the leaderboards arrive.
  if (!universe) {
    ensureUniverse().then(() => {
      back.querySelectorAll("[data-pl]").forEach(el => {
        const u = universe.get(el.dataset.pl);
        if (!u || u.pAll == null) return;
        el.textContent = (u.pAll >= 0 ? "+" : "") + fmtUsd(u.pAll) + " all-time";
        el.className = "pl " + (u.pAll >= 0 ? "pos" : "neg");
      });
    });
  }
}

/* Only the wallets that actually hold this position get queried, and the window
   start is rounded to 5 minutes so reopening the sheet hits the cache instead of
   generating a fresh URL every second. */
async function loadTrades(r, holders) {
  if (tradeCache.has(r.asset)) return tradeCache.get(r.asset);
  const start = Math.floor((Date.now() / 1000 - DETAIL_DAYS * 86400) / 300) * 300;
  const per = await mapLimit(holders, 4, async h => {
    const rows = await getJSON(
      `${DATA}/activity?user=${h.address}&limit=500&type=TRADE&start=${start}&sortDirection=DESC`,
      { ttl: 300000 });
    return (Array.isArray(rows) ? rows : [])
      .filter(t => t.asset === r.asset)
      .map(t => ({ ...t, who: h.name || short(h.address), address: h.address }));
  });
  const flat = per.filter(Array.isArray).flat()
    .sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0));
  tradeCache.set(r.asset, flat);
  return flat;
}

function renderTrades(r, holders, trades) {
  const head = `<h3>When they traded it <span class="c">last ${DETAIL_DAYS} days</span></h3>`;
  if (!trades.length) {
    // An empty list here does NOT mean they never traded it — the activity feed
    // only reaches back 30 days, and these are long-held positions by definition.
    return head + `<div class="skel">No trades in the last ${DETAIL_DAYS} days.
      These wallets still hold the position, so they opened it earlier than this
      window reaches.</div>`;
  }
  const bought = trades.filter(t => t.side !== "SELL")
    .reduce((s, t) => s + (Number(t.usdcSize) || 0), 0);
  const sold = trades.filter(t => t.side === "SELL")
    .reduce((s, t) => s + (Number(t.usdcSize) || 0), 0);
  return head + `
    <div class="skel" style="padding-bottom:6px">
      ${trades.length} trade${trades.length === 1 ? "" : "s"} ·
      <span class="pos">${fmtUsd(bought)} bought</span> ·
      <span class="neg">${fmtUsd(sold)} sold</span>
    </div>
    ${trades.slice(0, 60).map(t => {
      const sell = t.side === "SELL";
      return `<div class="trade-row">
        <span class="nm">${esc(t.who)}</span>
        <span class="pill ${sell ? "pill-no" : "pill-yes"}">${sell ? "SELL" : "BUY"}</span>
        <span class="amt">${fmtNum(Number(t.size) || 0)} @ ${fmtCents(Number(t.price) || 0)}</span>
        <span class="amt dim">${fmtUsd(Number(t.usdcSize) || 0)}</span>
        <span class="when">${ago(Number(t.timestamp) || 0)} ago</span>
      </div>`;
    }).join("")}
    ${trades.length > 60 ? `<div class="skel">Showing the 60 most recent of ${trades.length}.</div>` : ""}`;
}

function pill(o) {
  const t = String(o || "").toLowerCase();
  const cls = t === "yes" ? "pill-yes" : t === "no" ? "pill-no" : "pill-other";
  return `<span class="pill ${cls}">${esc(o || "?")}</span>`;
}
function tile(k, v) {
  return `<div class="tile"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
}

function weightToolbar(withThreshold = false) {
  return `<div class="toolrow">
    <span class="label">Weight by</span>
    <select id="weightSel">
      <option value="capital" ${ui.weight === "capital" ? "selected" : ""}>Dollars (whales count more)</option>
      <option value="equal" ${ui.weight === "equal" ? "selected" : ""}>Per wallet (everyone equal)</option>
    </select>
    ${withThreshold ? `<span class="label">Min wallets agreeing</span>
      <select id="minCons">${[2, 3, 4, 5].map(n =>
        `<option value="${n}" ${n === ui.minConsensus ? "selected" : ""}>${n}</option>`).join("")}</select>` : ""}
  </div>`;
}
function wireWeight() {
  const w = document.getElementById("weightSel");
  if (w) w.onchange = e => { ui.weight = e.target.value; render(); };
  const m = document.getElementById("minCons");
  if (m) m.onchange = e => { ui.minConsensus = +e.target.value; render(); };
}
function wireSort(v) {
  $content.querySelectorAll("th.sortable").forEach(el => {
    el.onclick = () => {
      const cur = curSort(v);
      const key = el.dataset.sort;
      ui.sort[v] = { key, dir: cur.key === key && cur.dir === "desc" ? "asc" : "desc" };
      render();
    };
  });
}
function stat(label, value, sub, cls = "") {
  return `<div class="stat"><dt>${esc(label)}</dt>
    <dd class="${cls}">${esc(value)}</dd>
    <span class="sub">${esc(sub)}</span></div>`;
}
function ago(ts) {
  if (!ts) return "—";
  const s = Date.now() / 1000 - ts;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 86400) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}

/* ============================================================
   list mutation
   ============================================================ */
function addWallet(listId, address, name) {
  const l = store.lists[listId];
  if (!l) return false;
  const a = String(address || "").toLowerCase().trim();
  if (!/^0x[0-9a-f]{40}$/.test(a)) return false;
  if (l.wallets.some(w => w.address === a)) return false;
  l.wallets.push({ address: a, name: name || short(a), label: "" });
  return true;
}

/* ============================================================
   events
   ============================================================ */
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => { view = t.dataset.view; render(); };
});
document.getElementById("refresh").onclick = () => {
  // Refresh has to mean refresh — the drill-down keeps its own caches, and
  // leaving them behind would hand back yesterday's trades under new numbers.
  cache.clear();
  tradeCache.clear();
  universe = null;
  render();
};

document.getElementById("newList").onclick = () => {
  const name = prompt("Name this list", "New list");
  if (!name || !name.trim()) return;
  const id = "l" + Date.now();
  store.lists[id] = { id, name: name.trim(), wallets: [] };
  store.activeId = id;
  save(); view = "members"; render();
};

document.getElementById("addForm").onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById("addAddr");
  const raw = input.value.trim();
  if (!raw) return;
  const ok = addWallet(store.activeId, raw);
  if (!ok) {
    setStatus(/^0x[0-9a-fA-F]{40}$/.test(raw)
      ? "That wallet is already in this list"
      : "Not a wallet address — needs 0x followed by 40 hex characters");
    return;
  }
  input.value = "";
  save();
  setStatus(`Added to ${activeList().name}`);
  render();
};

/* delegated clicks: list switch, add-from-leaderboard, remove member, drill-down */
document.addEventListener("click", e => {
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard.writeText(copy.dataset.copy)
      .then(() => { copy.textContent = "✓"; setTimeout(() => { copy.textContent = "⧉"; }, 1200); })
      .catch(() => setStatus("Clipboard blocked by browser"));
    return;
  }

  const li = e.target.closest("[data-list]");
  if (li) { store.activeId = li.dataset.list; save(); render(); return; }

  const add = e.target.closest("[data-add]");
  if (add) {
    const ok = addWallet(store.activeId, add.dataset.add, add.dataset.name);
    save(); renderRail();
    setStatus(ok ? `Added ${add.dataset.name} to ${activeList().name}`
                 : "Already in this list");
    return;
  }

  const rm = e.target.closest("[data-rm]");
  if (rm) {
    const l = activeList();
    l.wallets = l.wallets.filter(w => w.address !== rm.dataset.rm);
    save(); render();
    return;
  }

  // Last, so a click on a button inside a row is handled as that button.
  const row = e.target.closest("[data-detail]");
  if (row && !e.target.closest("a, button")) openDetail(row.dataset.detail);
});

/* Rows are focusable, so they answer the keyboard too. */
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest && e.target.closest("[data-detail]");
  if (!row) return;
  e.preventDefault();
  openDetail(row.dataset.detail);
});

wireTheme();
render();
</script>
</body>
</html>
